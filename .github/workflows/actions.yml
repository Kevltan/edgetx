---
name: Run tests
on:
  push:
    branches:
      - '2.6'
      - '2.7'
      - '2.8'
      - 'main'
    tags:
      - v*
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/nightly.yml'
      - '.github/workflows/linux_cpn.yml'
      - '.github/workflows/macosx_cpn.yml'
      - '.github/workflows/win-cpn-32.yml'
      - '.github/workflows/win_cpn-64.yml'
      - 'companion/**'
      - '.gitpod.yml'
      - '.devcontainer/**'
  pull_request:
    branches:
      - '2.6'
      - '2.7'
      - '2.8'
      - 'main'
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/nightly.yml'
      - '.github/workflows/linux_cpn.yml'
      - '.github/workflows/macosx_cpn.yml'
      - '.github/workflows/win-cpn-32.yml'
      - '.github/workflows/win_cpn-64.yml'
      - 'companion/**'
      - '.gitpod.yml'
      - '.devcontainer/**'
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - nv14
          - t12
          - t16
          - t18
          - t8
          - tlite
          - tx12
          - tx16s
          - x10
          - x12s
          - x7
          - x9d
          - x9dp
          - x9dp2019
          - x9e
          - x9lite
          - x9lites
          - xlite
          - xlites
    container:
      image: ghcr.io/edgetx/edgetx-dev:latest
      volumes:
        - ${{ github.workspace }}:/src
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
        with:
          submodules: recursive
          # fetch-depth: 0 # https://github.com/actions/checkout#Fetch-all-history-for-all-tags-and-branches

      # This source tree still uses Qt 5 for the native simulator and radio tests.
      # The current edgetx-dev:latest image ships Qt 6, so install the Qt 5
      # development modules needed by this older branch before configuring native targets.
      - name: Install Qt 5 test dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            qtbase5-dev \
            qttools5-dev \
            qtmultimedia5-dev \
            libqt5svg5-dev

      - name: Test ${{ matrix.target }}
        env:
          FLAVOR: ${{ matrix.target }}
        run: |
          echo "Running commit tests"
          ./tools/commit-tests.sh
